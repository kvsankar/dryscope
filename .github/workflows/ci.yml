name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  credential-paths:
    name: Credential paths (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Test credential paths
        run: uv run pytest tests/test_environment.py

  test:
    name: Tests and package checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Run manual quality gates
        run: uv run pre-commit run --hook-stage manual --all-files

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build --no-sources

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Smoke test built wheel
        run: uvx --from dist/*.whl dryscope --version
